group = com.example
version = 1.0.0-SNAPSHOT

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# The probe code is shared and compiled into each plugin, so the stdlib comes from the IDE.
kotlin.stdlib.default.dependency = false

# Skiko version bundled by each plugin (resolved from mavenLocal).
skikoA = 0.0.0-SNAPSHOT
skikoB = 0.0.1-SNAPSHOT

# Local IDE to compile against and run (avoids downloading one).
ideaPath = /Applications/IntelliJ IDEA.app
